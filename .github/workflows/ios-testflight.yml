# Builds the iOS app from this repo and uploads it to TestFlight (App Store Connect app id6759854905).
# Run it from GitHub: Actions → "iOS TestFlight" → Run workflow (pick the branch, normally dev),
# or push to the `testflight` branch. Nothing here touches the App Store release; builds go to
# TestFlight only, and testers get them once they've finished processing (10–30 minutes).
#
# One-off set-up (Settings → Secrets and variables → Actions), see MOBILE.md "TestFlight":
#   APPLE_TEAM_ID (variable or secret)
#   Secrets:   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API key, Admin role)
#   Maps and weather keys stay in Supabase secrets (the app-services function), not here.
name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches: [testflight]

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # The public Supabase client settings (the same ones every app build ships with)
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ehgbpdqbsykhepuwdgrj.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVoZ2JwZHFic3lraGVwdXdkZ3JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY3NzU5NDksImV4cCI6MjA2MjM1MTk0OX0.0kSB5eNYho_vO55Z8XXavRne_xpwArdlA1D2mJmrXs8' }}
      VITE_APP_URL: ${{ vars.VITE_APP_URL || 'https://app.alfiepro.com.au' }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_WEATHER_API_KEY: ${{ secrets.VITE_WEATHER_API_KEY }}
      VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
      VITE_STORMGLASS_API_KEY: ${{ secrets.VITE_STORMGLASS_API_KEY }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # Build numbers only have to go up within 2.0.0; the run number does that
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check the set-up
        env:
          ASC_KEY_P8_SET: ${{ secrets.ASC_KEY_P8 != '' }}
        run: |
          missing=""
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ "$ASC_KEY_P8_SET" = "true" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Add these in Settings → Secrets and variables → Actions:$missing"; exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install
        run: npm ci

      - name: Build the app and copy it into iOS
        run: |
          npx vite build
          npx cap sync ios

      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*signing|ARCHIVE (SUCCEEDED|FAILED)" || true
          test -d "$RUNNER_TEMP/App.xcarchive" || { tail -80 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "### Uploaded AlfiePRO 2.0.0 ($BUILD_NUMBER) to TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "It shows in App Store Connect → TestFlight once Apple has processed it." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
